services:
  
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
    networks:
      - microservices-network

  service-alpha:
    container_name: service-alpha
    build: 
      context: ./service-alpha
      dockerfile: Dockerfile
    expose:
      - "5000"
    ports:
      - "5000:5000"
    env_file:
      - service-alpha/.env
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://127.0.0.1:5000/',
        r=> process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1))
        .on('error', () => process.exit(1))"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      - consul
    networks:
      - microservices-network

  service-beta:
    container_name: service-beta
    build: 
      context: ./service-beta
      dockerfile: Dockerfile
    expose:
      - "5001"
    ports:
      - "5001:5001"
    env_file:
      - service-beta/.env
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://127.0.0.1:5001/',
        r=> process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1))
        .on('error', () => process.exit(1))"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      - consul
    networks:
      - microservices-network

  service-delta:
    container_name: service-delta
    build: 
      context: ./service-delta
      dockerfile: Dockerfile
    expose:
      - "5002"
    ports:
      - "5002:5002"
    env_file:
      - service-delta/.env
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://127.0.0.1:5002/',
        r=> process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1))
        .on('error', () => process.exit(1))"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      - consul
    networks:
      - microservices-network

  api-gateway:
    container_name: api-gateway
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    expose:
      - "555"
    environment:
      PORT: 555
      CONSUL_URL: http://consul:8500
    ports:
      - "555:555"
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://127.0.0.1:5002/',
        r=> process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1))
        .on('error', () => process.exit(1))"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - consul
    networks:
      - microservices-network

networks:
  microservices-network:
    name: microservices-network
    driver: bridge